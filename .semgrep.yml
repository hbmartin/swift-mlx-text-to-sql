rules:
  - id: creg-typed-diagnostic-classification
    message: Classify pipeline failures by typed error or validation issue, not text markers.
    severity: ERROR
    languages: [swift]
    mode: taint
    pattern-sources:
      - patterns:
          - pattern: $MARKER
          - metavariable-regex:
              metavariable: $MARKER
              regex: (?i).*portfolio_database_unavailable.*
    pattern-sinks:
      - pattern-either:
          - pattern: $VALUE.contains($NEEDLE)
          - pattern: $VALUE.hasPrefix($NEEDLE)
          - pattern: $VALUE.hasSuffix($NEEDLE)
  - id: creg-database-identity-requires-canonical-inputs
    message: Canonicalize paired database paths and inputs before deriving their set identity.
    severity: ERROR
    languages: [python]
    patterns:
      - pattern: database_set_identity($INPUTS)
      - pattern-not-inside: |
          $PATHS, $INPUTS = canonicalize_database_inputs(...)
          ...
          database_set_identity($INPUTS)
  - id: creg-identity-requires-structured-components
    message: Use a structured Hashable identity instead of delimiter-joining uncontrolled strings.
    severity: ERROR
    languages: [swift]
    mode: taint
    pattern-sources:
      - pattern: '$PARTS.joined(separator: $SEPARATOR)'
    pattern-sinks:
      - patterns:
          - pattern: 'self.$IDENTITY = $VALUE'
          - metavariable-regex:
              metavariable: $IDENTITY
              regex: &structured-identity-name (?i)^(?!(?:display|label|text)(?:key|identity)$).*(?:key|identity)$
      - patterns:
          - pattern: |
              var $IDENTITY: $TYPE {
                ...
                return $VALUE
              }
          - focus-metavariable: $VALUE
          - metavariable-regex:
              metavariable: $IDENTITY
              regex: *structured-identity-name
      - patterns:
          - pattern: |
              var $IDENTITY: $TYPE {
                ...
                $VALUE
              }
          - pattern-not: |
              var $IDENTITY: $TYPE {
                ...
                return $RETURNED
                ...
              }
          - pattern-not: |
              var $IDENTITY: $TYPE {
                switch $SUBJECT {
                case $CASE:
                  ...
                }
              }
          - focus-metavariable: $VALUE
          - metavariable-regex:
              metavariable: $IDENTITY
              regex: *structured-identity-name
      # Semgrep 1.170 does not propagate taint from a switch-expression branch
      # to the whole implicit-return switch. Match the forbidden join directly
      # when the switch is the computed identity's complete expression body.
      - patterns:
          - pattern-inside: |
              var $IDENTITY: $TYPE {
                switch $SUBJECT {
                case $CASE:
                  ...
                }
              }
          - pattern: '$PARTS.joined(separator: $SEPARATOR)'
          - metavariable-regex:
              metavariable: $IDENTITY
              regex: *structured-identity-name
