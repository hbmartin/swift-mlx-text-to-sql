rules:
  - id: creg-typed-diagnostic-classification
    message: Classify pipeline failures by typed error or validation issue, not text markers.
    severity: ERROR
    languages: [swift]
    mode: taint
    pattern-sources:
      - patterns:
          - pattern: $MARKER
          - metavariable-regex:
              metavariable: $MARKER
              regex: (?i).*portfolio_database_unavailable.*
    pattern-sinks:
      - pattern-either:
          - pattern: $VALUE.contains($NEEDLE)
          - pattern: $VALUE.hasPrefix($NEEDLE)
          - pattern: $VALUE.hasSuffix($NEEDLE)
  - id: creg-database-identity-requires-canonical-inputs
    message: Canonicalize paired database paths and inputs before deriving their set identity.
    severity: ERROR
    languages: [python]
    patterns:
      - pattern: database_set_identity($INPUTS)
      - pattern-not-inside: |
          $PATHS, $INPUTS = canonicalize_database_inputs(...)
          ...
          database_set_identity($INPUTS)
  - id: creg-shell-contracts-require-structured-validation
    message: Validate executable shell contracts structurally, not with raw substring membership.
    severity: ERROR
    languages: [python]
    mode: taint
    pattern-sources:
      - pattern-either:
          - pattern: $MAPPING.get("run")
          - pattern: $MAPPING.get("run", $DEFAULT)
          - pattern: $MAPPING.get("shellScript")
          - pattern: $MAPPING.get("shellScript", $DEFAULT)
          - pattern: $MAPPING["run"]
          - pattern: $MAPPING["shellScript"]
    pattern-sinks:
      - pattern-either:
          - pattern: $FRAGMENT in $SCRIPT
          - pattern: $FRAGMENT not in $SCRIPT
          - pattern: $SCRIPT.find($FRAGMENT)
          - pattern: $SCRIPT.index($FRAGMENT)
          - pattern: $SCRIPT.startswith($FRAGMENT)
          - pattern: $SCRIPT.endswith($FRAGMENT)
  - id: creg-identity-requires-structured-components
    message: Use a structured Hashable identity instead of delimiter-joining uncontrolled strings.
    severity: ERROR
    languages: [swift]
    mode: taint
    pattern-sources:
      - pattern: '$PARTS.joined(separator: $SEPARATOR)'
    pattern-sinks:
      - patterns:
          - pattern: 'self.$IDENTITY = $VALUE'
          - metavariable-regex:
              metavariable: $IDENTITY
              regex: '^(?!(?:display|label|text)[A-Za-z0-9_]*(?:Key|Identity)$)(?:[A-Za-z_][A-Za-z0-9_]*(?:Key|Identity)|key|identity)$'
      - patterns:
          - pattern: |
              var $IDENTITY: $TYPE {
                ...
                return $VALUE
              }
          - focus-metavariable: $VALUE
          - metavariable-regex:
              metavariable: $IDENTITY
              regex: '^(?!(?:display|label|text)[A-Za-z0-9_]*(?:Key|Identity)$)(?:[A-Za-z_][A-Za-z0-9_]*(?:Key|Identity)|key|identity)$'
      - patterns:
          - pattern: |
              var $IDENTITY: $TYPE {
                ...
                $VALUE
              }
          - pattern-not: |
              var $IDENTITY: $TYPE {
                ...
                return $RETURNED
                ...
              }
          - pattern-not: |
              var $IDENTITY: $TYPE {
                switch $SUBJECT {
                case $CASE:
                  ...
                }
              }
          - focus-metavariable: $VALUE
          - metavariable-regex:
              metavariable: $IDENTITY
              regex: '^(?!(?:display|label|text)[A-Za-z0-9_]*(?:Key|Identity)$)(?:[A-Za-z_][A-Za-z0-9_]*(?:Key|Identity)|key|identity)$'
      # Semgrep 1.170 does not propagate taint from a switch-expression branch
      # to the whole implicit-return switch. Treat each branch's final value as
      # the sink so display-only joins elsewhere in the branch remain legal.
      - patterns:
          - pattern-inside: |
              var $IDENTITY: $TYPE {
                switch $SUBJECT {
                case $CASE:
                  ...
                }
              }
          - pattern: $VALUE
          - pattern-not-inside: 'let $LOCAL = ...'
          - pattern-not-inside: '_ = ...'
          - pattern-not-inside: '$CALL(<... $VALUE ...>)'
          - metavariable-regex:
              metavariable: $IDENTITY
              regex: '^(?!(?:display|label|text)[A-Za-z0-9_]*(?:Key|Identity)$)(?:[A-Za-z_][A-Za-z0-9_]*(?:Key|Identity)|key|identity)$'
