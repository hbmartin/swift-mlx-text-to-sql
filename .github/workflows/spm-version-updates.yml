name: Swift Package Version Updates

# Runs only against the trusted default branch. Dependency staleness is a
# property of the manifest on main rather than of any single pull request, so
# there is no reason to give this job pull-request contents to read: the
# report is identical and no untrusted input reaches a privileged context.
# Runs without a pull request open or update a single tracking issue instead.
on:
  schedule:
    - cron: "0 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: spm-version-updates
  cancel-in-progress: false

jobs:
  spm-version-updates:
    name: Check Swift package updates
    runs-on: ubuntu-latest
    steps:
      - name: Check out the default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Report Swift package updates
        uses: hbmartin/github-action-spm_version_updates@c3cbe21c807e8a99fd61dba23c0d5476725a5a18 # v1.2.0
        with:
          package-manifest-paths: CREGKit/Package.swift
          report-above-maximum: true
          allow-hosts: github.com
          open-tracking-issue: true
