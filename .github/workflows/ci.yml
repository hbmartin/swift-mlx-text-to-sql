name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  swift:
    name: Swift tests
    runs-on: macos-26
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Select Xcode 26.3
        run: sudo xcode-select --switch /Applications/Xcode_26.3.app

      - name: Cache Swift and Xcode build artifacts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            CREGKit/.build
            ${{ runner.temp }}/creg-derived-data
            ${{ runner.temp }}/creg-source-packages
          key: swift-xcode-${{ runner.os }}-${{ runner.arch }}-xcode-26.3-${{ hashFiles('CREGKit/Package.resolved', 'CREG.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}

      - name: Verify checked-in Swift package resolutions
        run: |
          swift package --package-path CREGKit resolve
          xcodebuild -resolvePackageDependencies \
            -project CREG.xcodeproj \
            -scheme CREG \
            -clonedSourcePackagesDirPath "${RUNNER_TEMP}/creg-source-packages"
          git diff --exit-code -- \
            CREGKit/Package.resolved \
            CREG.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved

      - name: Test Swift packages
        working-directory: CREGKit
        run: swift test

  accessibility:
    name: Accessibility UI contracts
    runs-on: macos-26
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Select Xcode 26.3
        run: sudo xcode-select --switch /Applications/Xcode_26.3.app

      - name: Cache Swift and Xcode build artifacts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            CREGKit/.build
            ${{ runner.temp }}/creg-derived-data
            ${{ runner.temp }}/creg-source-packages
          key: swift-xcode-${{ runner.os }}-${{ runner.arch }}-xcode-26.3-${{ hashFiles('CREGKit/Package.resolved', 'CREG.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved', 'CREGKit/Package.swift', 'CREGKit/Sources/**', 'CREGKit/Tests/**', 'CREG.xcodeproj/project.pbxproj', 'CREG/**', 'CREGUITests/**') }}

      - name: Test focused accessibility UI contracts
        timeout-minutes: 30
        shell: /usr/bin/env -i HOME=/Users/runner PATH=/usr/bin:/bin:/usr/sbin:/sbin /bin/bash --noprofile --norc -e -o pipefail {0}
        working-directory: ${{ github.workspace }}
        run: |
          /usr/bin/xcodebuild test \
            -project CREG.xcodeproj \
            -scheme CREG \
            -destination 'platform=iOS Simulator,name=iPhone 17 Pro,OS=26.5' \
            -clonedSourcePackagesDirPath "${{ runner.temp }}/creg-source-packages" \
            -derivedDataPath "${{ runner.temp }}/creg-derived-data" \
            -resultBundlePath "${{ runner.temp }}/creg-accessibility-ui-tests.xcresult" \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            -only-testing:CREGUITests/AccessibilityUITests/testHighestRiskScreensAtAX5Landscape \
            -only-testing:CREGUITests/AccessibilityUITests/testMalformedConfigurationRendersInvalidConfigurationScreen \
            -only-testing:CREGUITests/AccessibilityUITests/testChartPreparationHasDistinctIdentityInProductionPresentation \
            -only-testing:CREGUITests/AccessibilityUITests/testChartRecoveryControlsOwnFullLeadingTouchTargets \
            -only-testing:CREGUITests/AccessibilityUITests/testTerminalChartRecoveryOwnsOneFullLeadingTouchTarget \
            CREG_ACCESSIBILITY_HARNESS_BUILD=YES

      - name: Upload accessibility UI test results
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: accessibility-ui-test-results
          path: ${{ runner.temp }}/creg-accessibility-ui-tests.xcresult
          if-no-files-found: warn
          retention-days: 14

  python:
    name: Python tests and corpus determinism
    runs-on: macos-26
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          enable-cache: true

      - name: Install Python
        run: uv python install 3.13

      - name: Run Python tests
        working-directory: fine-tuning
        run: uv run --frozen pytest -q

      - name: Verify generated schema resources
        working-directory: fine-tuning
        run: |
          uv run --frozen python -m tools.generate_grammar
          git -C .. diff --exit-code -- \
            CREGKit/Sources/CREGInference/Resources/sql_grammar.ebnf \
            CREGKit/Sources/CREGInference/Resources/schema_prompt.txt \
            CREGKit/Sources/CREGData/Resources/schema_catalog.json

      - name: Regenerate corpus deterministically
        working-directory: fine-tuning
        run: |
          uv run --frozen python -m synth.generate_training --out-dir "${RUNNER_TEMP}/corpus"
          cmp synth/out/train.jsonl "${RUNNER_TEMP}/corpus/train.jsonl"
          cmp synth/out/valid.jsonl "${RUNNER_TEMP}/corpus/valid.jsonl"
          cmp synth/out/gate_stats.json "${RUNNER_TEMP}/corpus/gate_stats.json"

  testflight-publisher:
    name: TestFlight publisher contract tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install uv
        id: setup-uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        env:
          BASH_ENV: ""
          ENV: ""
          LD_PRELOAD: ""
          NODE_OPTIONS: ""
          PATH: /usr/bin:/bin:/usr/sbin:/sbin
        with:
          version: "0.12.7"
          checksum: "788f18abea7c5f55d6216e4f5613fd89d4d59b631efeec117b2b07fe72f1da21"
          enable-cache: false

      - name: Run TestFlight publisher tests
        shell: /usr/bin/env -i HOME=/home/runner PATH=/usr/bin:/bin:/usr/sbin:/sbin /bin/bash --noprofile --norc -e -o pipefail {0}
        working-directory: ${{ github.workspace }}
        run: >-
          TMPDIR="${{ runner.temp }}" UV_NO_CONFIG=1
          "${{ steps.setup-uv.outputs.uv-path }}"
          run --no-project --managed-python --python 3.13 python -m unittest discover
          -s .agents/skills/publish-creg-testflight/tests
          -p 'test_*.py'

  security:
    name: Security regression guards
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 2

      - name: Install uv
        id: setup-security-uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        env:
          BASH_ENV: ""
          ENV: ""
          LD_PRELOAD: ""
          NODE_OPTIONS: ""
          PATH: /usr/bin:/bin:/usr/sbin:/sbin
        with:
          version: "0.12.7"
          checksum: "788f18abea7c5f55d6216e4f5613fd89d4d59b631efeec117b2b07fe72f1da21"
          enable-cache: false

      - name: Verify workflow action pins
        shell: /usr/bin/env -i HOME=/home/runner PATH=/usr/bin:/bin:/usr/sbin:/sbin /bin/bash --noprofile --norc -e -o pipefail {0}
        working-directory: ${{ github.workspace }}/fine-tuning
        run: >-
          TMPDIR="${{ runner.temp }}" UV_NO_CONFIG=1
          "${{ steps.setup-security-uv.outputs.uv-path }}"
          run --frozen python -m tools.check_ci_contracts

      - name: Prevent unsafe diagnostic and evaluation identity patterns
        run: >-
          uvx --from semgrep==1.170.0 semgrep scan --error
          --config .semgrep.yml --include 'CREGKit/Sources/**/*.swift'
          --include 'fine-tuning/eval/**/*.py'
          --include 'fine-tuning/tools/**/*.py'
          --include '.agents/skills/publish-creg-testflight/scripts/**/*.py'

      - name: Test Semgrep rules
        shell: bash
        run: >-
          uvx --from semgrep==1.170.0 semgrep scan --metrics off --json
          --config .semgrep.yml semgrep-tests
          | uv run --no-project python fine-tuning/tools/check_semgrep_fixtures.py
          semgrep-tests

      - name: Check patch whitespace
        run: git diff --check HEAD^ HEAD
