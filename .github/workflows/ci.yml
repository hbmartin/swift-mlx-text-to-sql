name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  swift:
    name: Swift tests
    runs-on: xcode-27
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install Metal Toolchain
        run: xcodebuild -downloadComponent MetalToolchain

      - name: Verify AutoTableCharts pin agreement
        run: python3 fine-tuning/tools/check_swift_package_pins.py

      - name: Cache Swift and Xcode build artifacts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            CREGKit/.build
            ${{ runner.temp }}/creg-derived-data
            ${{ runner.temp }}/creg-source-packages
          key: swift-xcode-${{ runner.os }}-${{ runner.arch }}-xcode-27-${{ hashFiles('CREGKit/Package.resolved', 'CREG.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}

      - name: Verify checked-in Swift package resolutions
        run: |
          swift package --package-path CREGKit resolve
          xcodebuild -resolvePackageDependencies \
            -project CREG.xcodeproj \
            -scheme CREG \
            -clonedSourcePackagesDirPath "${RUNNER_TEMP}/creg-source-packages"
          git diff --exit-code -- \
            CREGKit/Package.resolved \
            CREG.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved

      - name: Test Swift packages
        working-directory: CREGKit
        run: swift test

  accessibility:
    name: Accessibility UI contracts (${{ matrix.shard }})
    runs-on: xcode-27
    timeout-minutes: 105
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - shard: canonical
            skip-arguments: >-
              -skip-testing:CREGUITests/AccessibilityUITests/testAccessibleHeadersWrapAtLargeTextSizes
              -skip-testing:CREGUITests/AccessibilityUITests/testAnswerActionAccessibilitySemantics
              -skip-testing:CREGUITests/AccessibilityUITests/testAnswerActionsAreAtLeast44Points
              -skip-testing:CREGUITests/AccessibilityUITests/testBrowserRefreshPreservesSearchAndKeyboardFocus
              -skip-testing:CREGUITests/AccessibilityUITests/testCancellingSharingReturnsToAnswerWithMoreClosed
              -skip-testing:CREGUITests/AccessibilityUITests/testChartPreparationHasDistinctIdentityInProductionPresentation
              -skip-testing:CREGUITests/AccessibilityUITests/testChartRecoveryControlsOwnFullLeadingTouchTargets
              -skip-testing:CREGUITests/AccessibilityUITests/testCompactJumpToLatestWithKeyboardAndCorrection
              -skip-testing:CREGUITests/AccessibilityUITests/testConversationLoadFailureOffersRecovery
              -skip-testing:CREGUITests/AccessibilityUITests/testConversationNoticesScrollAndRetainDismissalState
              -skip-testing:CREGUITests/AccessibilityUITests/testConversationWriteRecoveryOffersRetryInNoticesAndSettings
              -skip-testing:CREGUITests/AccessibilityUITests/testCorrectionControlsRemainReachableWithKeyboardAndReduceMotion
              -skip-testing:CREGUITests/AccessibilityUITests/testDrawerCancellationAllowsTheFirstFollowingSwipe
              -skip-testing:CREGUITests/AccessibilityUITests/testDrawerRealizationStaysBoundedAndUnrelatedErrorsDoNotRedrawRows
              -skip-testing:CREGUITests/AccessibilityUITests/testHighestRiskScreensAtAX5Landscape
              -skip-testing:CREGUITests/AccessibilityUITests/testHistoryProgressWarningsAreNeutralOnEverySurface
              -skip-testing:CREGUITests/AccessibilityUITests/testHistoryStoreRetryAtAX5PortraitAndLandscape
              -skip-testing:CREGUITests/AccessibilityUITests/testKnownIconControlsAreAtLeast44Points
              -skip-testing:CREGUITests/AccessibilityUITests/testLongDrawerPreviewsStayBoundedAndSettingsReachable
              -skip-testing:CREGUITests/AccessibilityUITests/testMalformedConfigurationRendersInvalidConfigurationScreen
              -skip-testing:CREGUITests/AccessibilityUITests/testMoreActionsRemainAccessibleInConstrainedHeight
              -skip-testing:CREGUITests/AccessibilityUITests/testMoreClosesWhenAnswerActionLayoutChanges
              -skip-testing:CREGUITests/AccessibilityUITests/testMoreRetainsHeldExportUntilExplicitRegeneration
              -skip-testing:CREGUITests/AccessibilityUITests/testNoticeTechnicalDetailsKeepFailureIdentity
              -skip-testing:CREGUITests/AccessibilityUITests/testPresentedSheetsReceiveEffectiveAX5
              -skip-testing:CREGUITests/AccessibilityUITests/testPreviewShowsNewTableWhenChartInputIdentityChanges
              -skip-testing:CREGUITests/AccessibilityUITests/testProductionSupportBindingDismissesAndReleasesArtifacts
              -skip-testing:CREGUITests/AccessibilityUITests/testRetainedExportCanBeDiscardedWithoutClearingOtherNotices
              -skip-testing:CREGUITests/AccessibilityUITests/testRetainedExportDoesNotAutomaticallyPresentSharing
              -skip-testing:CREGUITests/AccessibilityUITests/testRetryInspectionOffersDismissOnlyAtAX5PortraitAndLandscape
              -skip-testing:CREGUITests/AccessibilityUITests/testSharingReturnsToAnswerWithMoreClosed
              -skip-testing:CREGUITests/AccessibilityUITests/testSharingSurvivesConcurrentCompletionInLongTranscript
              -skip-testing:CREGUITests/AccessibilityUITests/testSimpleChartValuesAreAccessible
              -skip-testing:CREGUITests/AccessibilityUITests/testSupportWarningAtAX5PortraitAndLandscape
              -skip-testing:CREGUITests/AccessibilityUITests/testTerminalChartRecoveryOwnsOneFullLeadingTouchTarget
          - shard: interactions-a
            skip-arguments: >-
              -skip-testing:CREGUITests/AccessibilityUITests/testAnswerActionAccessibilitySemantics
              -skip-testing:CREGUITests/AccessibilityUITests/testBrowserRefreshPreservesSearchAndKeyboardFocus
              -skip-testing:CREGUITests/AccessibilityUITests/testCanonicalScreensDoNotClipTextOrShrinkHitRegions
              -skip-testing:CREGUITests/AccessibilityUITests/testChartPreparationHasDistinctIdentityInProductionPresentation
              -skip-testing:CREGUITests/AccessibilityUITests/testCompactJumpToLatestWithKeyboardAndCorrection
              -skip-testing:CREGUITests/AccessibilityUITests/testConversationNoticesScrollAndRetainDismissalState
              -skip-testing:CREGUITests/AccessibilityUITests/testCorrectionControlsRemainReachableWithKeyboardAndReduceMotion
              -skip-testing:CREGUITests/AccessibilityUITests/testDrawerRealizationStaysBoundedAndUnrelatedErrorsDoNotRedrawRows
              -skip-testing:CREGUITests/AccessibilityUITests/testHistoryProgressWarningsAreNeutralOnEverySurface
              -skip-testing:CREGUITests/AccessibilityUITests/testKnownIconControlsAreAtLeast44Points
              -skip-testing:CREGUITests/AccessibilityUITests/testMalformedConfigurationRendersInvalidConfigurationScreen
              -skip-testing:CREGUITests/AccessibilityUITests/testMoreClosesWhenAnswerActionLayoutChanges
              -skip-testing:CREGUITests/AccessibilityUITests/testNoticeTechnicalDetailsKeepFailureIdentity
              -skip-testing:CREGUITests/AccessibilityUITests/testPreviewShowsNewTableWhenChartInputIdentityChanges
              -skip-testing:CREGUITests/AccessibilityUITests/testRetainedExportCanBeDiscardedWithoutClearingOtherNotices
              -skip-testing:CREGUITests/AccessibilityUITests/testRetryInspectionOffersDismissOnlyAtAX5PortraitAndLandscape
              -skip-testing:CREGUITests/AccessibilityUITests/testSharingSurvivesConcurrentCompletionInLongTranscript
              -skip-testing:CREGUITests/AccessibilityUITests/testSupportWarningAtAX5PortraitAndLandscape
          - shard: interactions-b
            skip-arguments: >-
              -skip-testing:CREGUITests/AccessibilityUITests/testAccessibleHeadersWrapAtLargeTextSizes
              -skip-testing:CREGUITests/AccessibilityUITests/testAnswerActionsAreAtLeast44Points
              -skip-testing:CREGUITests/AccessibilityUITests/testCancellingSharingReturnsToAnswerWithMoreClosed
              -skip-testing:CREGUITests/AccessibilityUITests/testCanonicalScreensDoNotClipTextOrShrinkHitRegions
              -skip-testing:CREGUITests/AccessibilityUITests/testChartRecoveryControlsOwnFullLeadingTouchTargets
              -skip-testing:CREGUITests/AccessibilityUITests/testConversationLoadFailureOffersRecovery
              -skip-testing:CREGUITests/AccessibilityUITests/testConversationWriteRecoveryOffersRetryInNoticesAndSettings
              -skip-testing:CREGUITests/AccessibilityUITests/testDrawerCancellationAllowsTheFirstFollowingSwipe
              -skip-testing:CREGUITests/AccessibilityUITests/testHighestRiskScreensAtAX5Landscape
              -skip-testing:CREGUITests/AccessibilityUITests/testHistoryStoreRetryAtAX5PortraitAndLandscape
              -skip-testing:CREGUITests/AccessibilityUITests/testLongDrawerPreviewsStayBoundedAndSettingsReachable
              -skip-testing:CREGUITests/AccessibilityUITests/testMoreActionsRemainAccessibleInConstrainedHeight
              -skip-testing:CREGUITests/AccessibilityUITests/testMoreRetainsHeldExportUntilExplicitRegeneration
              -skip-testing:CREGUITests/AccessibilityUITests/testPresentedSheetsReceiveEffectiveAX5
              -skip-testing:CREGUITests/AccessibilityUITests/testProductionSupportBindingDismissesAndReleasesArtifacts
              -skip-testing:CREGUITests/AccessibilityUITests/testRetainedExportDoesNotAutomaticallyPresentSharing
              -skip-testing:CREGUITests/AccessibilityUITests/testSharingReturnsToAnswerWithMoreClosed
              -skip-testing:CREGUITests/AccessibilityUITests/testSimpleChartValuesAreAccessible
              -skip-testing:CREGUITests/AccessibilityUITests/testTerminalChartRecoveryOwnsOneFullLeadingTouchTarget
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install Metal Toolchain
        run: xcodebuild -downloadComponent MetalToolchain

      - name: Cache Swift and Xcode build artifacts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            CREGKit/.build
            ${{ runner.temp }}/creg-derived-data
            ${{ runner.temp }}/creg-source-packages
          key: swift-xcode-${{ runner.os }}-${{ runner.arch }}-xcode-27-${{ hashFiles('CREGKit/Package.resolved', 'CREG.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved', 'CREGKit/Package.swift', 'CREGKit/Sources/**', 'CREGKit/Tests/**', 'CREG.xcodeproj/project.pbxproj', 'CREG/**', 'CREGUITests/**') }}

      - name: Create isolated accessibility simulator
        id: accessibility_simulator
        shell: /bin/bash --noprofile --norc -e -o pipefail {0}
        env:
          BASH_ENV: ''
          ENV: ''
        run: |
          simulator_name='CREG-accessibility-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.shard }}'
          udid="$(/usr/bin/xcrun simctl create "$simulator_name" com.apple.CoreSimulator.SimDeviceType.iPhone-18-Pro com.apple.CoreSimulator.SimRuntime.iOS-27-0)"
          printf 'udid=%s\n' "$udid" >> "$GITHUB_OUTPUT"

      - name: Build focused accessibility UI contracts
        timeout-minutes: 30
        shell: /usr/bin/env -i HOME=/Users/runner PATH=/usr/bin:/bin:/usr/sbin:/sbin /bin/bash --noprofile --norc -e -o pipefail {0}
        working-directory: ${{ github.workspace }}
        run: |
          /usr/bin/xcodebuild build-for-testing \
            -project CREG.xcodeproj \
            -scheme CREG \
            -destination 'platform=iOS Simulator,id=${{ steps.accessibility_simulator.outputs.udid }}' \
            -clonedSourcePackagesDirPath "${{ runner.temp }}/creg-source-packages" \
            -derivedDataPath "${{ runner.temp }}/creg-derived-data" \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO \
            CREG_ACCESSIBILITY_HARNESS_BUILD=YES

      - name: Test focused accessibility UI contracts
        timeout-minutes: 60
        shell: /usr/bin/env -i HOME=/Users/runner PATH=/usr/bin:/bin:/usr/sbin:/sbin /bin/bash --noprofile --norc -e -o pipefail {0}
        working-directory: ${{ github.workspace }}
        run: |
          /usr/bin/xcodebuild test-without-building \
            -project CREG.xcodeproj \
            -scheme CREG \
            -destination 'platform=iOS Simulator,id=${{ steps.accessibility_simulator.outputs.udid }}' \
            -clonedSourcePackagesDirPath "${{ runner.temp }}/creg-source-packages" \
            -derivedDataPath "${{ runner.temp }}/creg-derived-data" \
            -resultBundlePath "${{ runner.temp }}/creg-accessibility-ui-tests.xcresult" \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            -only-testing:CREGUITests/AccessibilityUITests/testHighestRiskScreensAtAX5Landscape \
            -only-testing:CREGUITests/AccessibilityUITests/testMalformedConfigurationRendersInvalidConfigurationScreen \
            -only-testing:CREGUITests/AccessibilityUITests/testChartPreparationHasDistinctIdentityInProductionPresentation \
            -only-testing:CREGUITests/AccessibilityUITests/testChartRecoveryControlsOwnFullLeadingTouchTargets \
            -only-testing:CREGUITests/AccessibilityUITests/testTerminalChartRecoveryOwnsOneFullLeadingTouchTarget \
            -only-testing:CREGUITests/AccessibilityUITests/testPreviewShowsNewTableWhenChartInputIdentityChanges \
            -only-testing:CREGUITests/AccessibilityUITests/testAnswerActionsAreAtLeast44Points \
            -only-testing:CREGUITests/AccessibilityUITests/testKnownIconControlsAreAtLeast44Points \
            -only-testing:CREGUITests/AccessibilityUITests/testAnswerActionAccessibilitySemantics \
            -only-testing:CREGUITests/AccessibilityUITests/testSharingReturnsToAnswerWithMoreClosed \
            -only-testing:CREGUITests/AccessibilityUITests/testCancellingSharingReturnsToAnswerWithMoreClosed \
            -only-testing:CREGUITests/AccessibilityUITests/testMoreClosesWhenAnswerActionLayoutChanges \
            -only-testing:CREGUITests/AccessibilityUITests/testMoreActionsRemainAccessibleInConstrainedHeight \
            -only-testing:CREGUITests/AccessibilityUITests/testSimpleChartValuesAreAccessible \
            -only-testing:CREGUITests/AccessibilityUITests/testSharingSurvivesConcurrentCompletionInLongTranscript \
            -only-testing:CREGUITests/AccessibilityUITests/testConversationLoadFailureOffersRecovery \
            -only-testing:CREGUITests/AccessibilityUITests/testHistoryStoreRetryAtAX5PortraitAndLandscape \
            -only-testing:CREGUITests/AccessibilityUITests/testRetryInspectionOffersDismissOnlyAtAX5PortraitAndLandscape \
            -only-testing:CREGUITests/AccessibilityUITests/testSupportWarningAtAX5PortraitAndLandscape \
            -only-testing:CREGUITests/AccessibilityUITests/testConversationNoticesScrollAndRetainDismissalState \
            -only-testing:CREGUITests/AccessibilityUITests/testRetainedExportDoesNotAutomaticallyPresentSharing \
            -only-testing:CREGUITests/AccessibilityUITests/testBrowserRefreshPreservesSearchAndKeyboardFocus \
            -only-testing:CREGUITests/AccessibilityUITests/testCanonicalScreensDoNotClipTextOrShrinkHitRegions \
            -only-testing:CREGUITests/AccessibilityUITests/testPresentedSheetsReceiveEffectiveAX5 \
            -only-testing:CREGUITests/AccessibilityUITests/testAccessibleHeadersWrapAtLargeTextSizes \
            -only-testing:CREGUITests/AccessibilityUITests/testDrawerRealizationStaysBoundedAndUnrelatedErrorsDoNotRedrawRows \
            -only-testing:CREGUITests/AccessibilityUITests/testCorrectionControlsRemainReachableWithKeyboardAndReduceMotion \
            -only-testing:CREGUITests/AccessibilityUITests/testProductionSupportBindingDismissesAndReleasesArtifacts \
            -only-testing:CREGUITests/AccessibilityUITests/testMoreRetainsHeldExportUntilExplicitRegeneration \
            -only-testing:CREGUITests/AccessibilityUITests/testRetainedExportCanBeDiscardedWithoutClearingOtherNotices \
            -only-testing:CREGUITests/AccessibilityUITests/testLongDrawerPreviewsStayBoundedAndSettingsReachable \
            -only-testing:CREGUITests/AccessibilityUITests/testCompactJumpToLatestWithKeyboardAndCorrection \
            -only-testing:CREGUITests/AccessibilityUITests/testNoticeTechnicalDetailsKeepFailureIdentity \
            -only-testing:CREGUITests/AccessibilityUITests/testHistoryProgressWarningsAreNeutralOnEverySurface \
            -only-testing:CREGUITests/AccessibilityUITests/testDrawerCancellationAllowsTheFirstFollowingSwipe \
            -only-testing:CREGUITests/AccessibilityUITests/testConversationWriteRecoveryOffersRetryInNoticesAndSettings \
          ${{ matrix.skip-arguments }} \
            CODE_SIGNING_ALLOWED=NO \
            CREG_ACCESSIBILITY_HARNESS_BUILD=YES

      - name: Delete isolated accessibility simulator
        if: ${{ always() }}
        shell: /usr/bin/env -i HOME=/Users/runner PATH=/usr/bin:/bin:/usr/sbin:/sbin /bin/bash --noprofile --norc -e -o pipefail {0}
        run: |
          udid='${{ steps.accessibility_simulator.outputs.udid }}'
          if [ -n "$udid" ]; then
            /usr/bin/xcrun simctl shutdown "$udid" || true
            /usr/bin/xcrun simctl delete "$udid"
          fi

      - name: Upload accessibility UI test results
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: accessibility-ui-test-results-${{ matrix.shard }}
          path: ${{ runner.temp }}/creg-accessibility-ui-tests.xcresult
          if-no-files-found: warn
          retention-days: 14

  accessibility-contracts:
    name: Accessibility UI contracts
    needs: accessibility
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require all accessibility shards
        shell: /bin/bash --noprofile --norc -e -o pipefail {0}
        run: test '${{ needs.accessibility.result }}' = 'success'

  python:
    name: Python tests and corpus determinism
    runs-on: macos-26
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          enable-cache: true

      - name: Install Python
        run: uv python install 3.13

      - name: Run Python tests
        working-directory: fine-tuning
        run: uv run --frozen pytest -q

      - name: Verify generated schema resources
        working-directory: fine-tuning
        run: |
          uv run --frozen python -m tools.generate_grammar
          git -C .. diff --exit-code -- \
            CREGKit/Sources/CREGInference/Resources/sql_grammar.ebnf \
            CREGKit/Sources/CREGInference/Resources/schema_prompt.txt \
            CREGKit/Sources/CREGData/Resources/schema_catalog.json

      - name: Regenerate corpus deterministically
        working-directory: fine-tuning
        run: |
          uv run --frozen python -m synth.generate_training --out-dir "${RUNNER_TEMP}/corpus"
          cmp synth/out/train.jsonl "${RUNNER_TEMP}/corpus/train.jsonl"
          cmp synth/out/valid.jsonl "${RUNNER_TEMP}/corpus/valid.jsonl"
          cmp synth/out/gate_stats.json "${RUNNER_TEMP}/corpus/gate_stats.json"

  testflight-publisher:
    name: TestFlight publisher contract tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install uv
        id: setup-uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        env:
          BASH_ENV: ""
          ENV: ""
          LD_PRELOAD: ""
          NODE_OPTIONS: ""
          PATH: /usr/bin:/bin:/usr/sbin:/sbin
        with:
          version: "0.12.7"
          checksum: "788f18abea7c5f55d6216e4f5613fd89d4d59b631efeec117b2b07fe72f1da21"
          enable-cache: false

      - name: Run TestFlight publisher tests
        shell: /usr/bin/env -i HOME=/home/runner PATH=/usr/bin:/bin:/usr/sbin:/sbin /bin/bash --noprofile --norc -e -o pipefail {0}
        working-directory: ${{ github.workspace }}
        run: >-
          TMPDIR="${{ runner.temp }}" UV_NO_CONFIG=1
          "${{ steps.setup-uv.outputs.uv-path }}"
          run --no-project --managed-python --python 3.13 python -m unittest discover
          -s .agents/skills/publish-creg-testflight/tests
          -p 'test_*.py'

  security:
    name: Security regression guards
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 2

      - name: Install uv
        id: setup-security-uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        env:
          BASH_ENV: ""
          ENV: ""
          LD_PRELOAD: ""
          NODE_OPTIONS: ""
          PATH: /usr/bin:/bin:/usr/sbin:/sbin
        with:
          version: "0.12.7"
          checksum: "788f18abea7c5f55d6216e4f5613fd89d4d59b631efeec117b2b07fe72f1da21"
          enable-cache: false

      - name: Verify workflow action pins
        shell: /usr/bin/env -i HOME=/home/runner PATH=/usr/bin:/bin:/usr/sbin:/sbin /bin/bash --noprofile --norc -e -o pipefail {0}
        working-directory: ${{ github.workspace }}/fine-tuning
        run: >-
          TMPDIR="${{ runner.temp }}" UV_NO_CONFIG=1
          "${{ steps.setup-security-uv.outputs.uv-path }}"
          run --frozen python -m tools.check_ci_contracts

      - name: Prevent unsafe diagnostic and evaluation identity patterns
        run: >-
          uvx --from semgrep==1.170.0 semgrep scan --error
          --config .semgrep.yml --include 'CREGKit/Sources/**/*.swift'
          --include 'fine-tuning/eval/**/*.py'
          --include 'fine-tuning/tools/**/*.py'
          --include '.agents/skills/publish-creg-testflight/scripts/**/*.py'

      - name: Test Semgrep rules
        shell: bash
        run: >-
          uvx --from semgrep==1.170.0 semgrep scan --metrics off --json
          --config .semgrep.yml semgrep-tests
          | uv run --no-project python fine-tuning/tools/check_semgrep_fixtures.py
          semgrep-tests

      - name: Check patch whitespace
        run: git diff --check HEAD^ HEAD
